name: 'Check and Test'

# Only lint/tests run here. The app is compiled exclusively by release.yml,
# triggered by a v* tag (pushed manually or created by the create-tag job below).

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Check tool logic
        run: npm run check

      - name: Test native commands
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

  # Create tag when push to main is successful
  create-tag:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
        
      - name: Get version and create tag
        id: tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          
          # Check if tag already exists
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping tag creation"
            echo "tag_created=false" >> $GITHUB_OUTPUT
          else
            echo "Creating tag $TAG"
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "tag_created=true" >> $GITHUB_OUTPUT
          fi
          
      - name: Trigger release workflow
        if: steps.tag.outputs.tag_created == 'true'
        run: |
          echo "🚀 Triggering release workflow for tag: ${{ steps.tag.outputs.tag }}"
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{
              "event_type": "release_requested",
              "client_payload": {
                "tag": "${{ steps.tag.outputs.tag }}",
                "version": "${{ steps.tag.outputs.version }}",
                "sha": "${{ github.sha }}"
              }
            }'
          
      - name: Tag created notification
        if: steps.tag.outputs.tag_created == 'true'
        run: |
          echo "✅ Tag ${{ steps.tag.outputs.tag }} created successfully!"
          echo "🚀 Release workflow has been triggered."
